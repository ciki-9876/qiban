name: Verify prototype
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 outputs/qiban-growth-prototype/build.py
      - run: node --test outputs/qiban-growth-prototype/tests/*.test.mjs
      - run: python3 scripts/build-pages.py
      - run: node --test scripts/test-pages.mjs
