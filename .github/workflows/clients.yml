name: Qiban client test builds
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['clients/**', 'outputs/qiban-growth-prototype/**', 'scripts/build-clients.mjs', 'package.json', 'package-lock.json', '.github/workflows/clients.yml']
  pull_request:
    paths: ['clients/**', 'outputs/qiban-growth-prototype/**', 'scripts/build-clients.mjs', 'package.json', 'package-lock.json', '.github/workflows/clients.yml']
permissions:
  contents: read
concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 outputs/qiban-growth-prototype/build.py
      - run: node scripts/build-clients.mjs
      - run: npm test
      - run: python3 scripts/build-pages.py
      - run: node scripts/test-pages.mjs
  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-clients.mjs
      - run: npm ci
        working-directory: clients/windows
      - run: npm test
        working-directory: clients/windows
      - run: npm run dist
        working-directory: clients/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged application
        shell: pwsh
        run: node clients/windows/smoke.cjs "$PWD/artifacts/windows/win-unpacked/栖伴测试版.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: qiban-windows-x64-0.9.0-beta.1
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.zip
          if-no-files-found: error
          retention-days: 14
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action feeds 'y' to package installs independently of the license flag.
          packages: ''
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - name: Prepare required Android SDK packages without accepting licenses
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" </dev/null
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - run: npm ci
      - run: node scripts/build-clients.mjs
      - run: ../../node_modules/.bin/cap sync android
        working-directory: clients/mobile
      - run: node sync-native.mjs
        working-directory: clients/mobile
      - run: ./gradlew assembleDebug
        working-directory: clients/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: qiban-android-test-0.9.0-beta.1
          path: clients/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - name: Use only previously licensed Android build packages
        shell: bash
        run: |
          mkdir -p artifacts/android-smoke
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" </dev/null 2>&1 | tee artifacts/android-smoke/sdk-core-install.log
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - run: npm ci
      - run: node scripts/build-clients.mjs
      - run: node --test clients/mobile/tests/*.test.mjs
      - run: ../../node_modules/.bin/cap sync android
        working-directory: clients/mobile
      - run: node sync-native.mjs
        working-directory: clients/mobile
      - name: Build an isolated pair of app and instrumentation APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: clients/mobile/android
      - name: Verify bundled Android login and encrypted fixture in AOSP emulator
        run: node clients/mobile/smoke-android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiban-android-smoke-0.9.0-beta.1
          path: |
            artifacts/android-smoke/
            clients/mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
