<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录 · 栖伴</title>
<style>:root{color-scheme:dark;--bg:#0f1320;--panel:#161b2b;--ink:#ede6d6;--muted:#a39e93;--line:rgba(237,230,214,.18);--accent:#e8b04a;--on-accent:#0f1320;--link:#e8b04a;--error:#ff9a8a;font-family:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#e6ecf1;--panel:#f5f8fa;--ink:#172033;--muted:#4e5868;--line:rgba(23,32,51,.18);--accent:#e8b04a;--on-accent:#172033;--link:#8a5a0b;--error:#a43744}}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg)}main{width:min(360px,calc(100vw - 48px));padding:max(40px,env(safe-area-inset-top)) 0 max(40px,env(safe-area-inset-bottom))}small{color:var(--muted);letter-spacing:.16em;font-size:13px}h1{font-family:"Songti SC","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC",serif;font-size:32px;font-weight:300;line-height:1.35;margin:14px 0}p{line-height:1.7;color:var(--muted);font-size:15px}label{display:block;margin-top:22px;font-size:14px;color:var(--muted)}input{box-sizing:border-box;width:100%;min-height:48px;padding:12px 14px;margin-top:8px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;color:var(--ink);background:var(--panel)}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{font:inherit;cursor:pointer;border-radius:999px;padding:13px 18px;min-height:48px}button[type=submit]{width:100%;margin-top:24px;border:0;background:var(--accent);color:var(--on-accent);font-weight:500}button:disabled{opacity:.5}#switch{display:block;margin:18px auto;border:0;background:transparent;color:var(--link)}#error{min-height:24px;color:var(--error)}a{color:var(--link)}</style>
<meta name="qiban-cloud" content="true"><meta name="theme-color" content="#0f1320"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png"><script src="/platform.js"></script><script src="/client-update.js"></script></head><body><main><small>QIBAN · 栖伴</small><h1 id="title">回来，继续自己的目标。</h1><p id="intro">登录后，你的目标、记录和附件会留在自己的账号里。</p><form id="auth"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,31}" placeholder="3–32 位字母、数字、下划线或短横线"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="至少 12 个字符"><p id="error" role="alert"></p><button type="submit" id="submit">登录</button></form><button id="switch" type="button">第一次来？创建账号</button><p>每人独立配置 AI 服务。使用 AI 时，本次内容会发送给你选择的服务商。请妥善保存账号和密码；当前尚不支持自助找回。</p></main><script src="/login.js"></script></body></html>
