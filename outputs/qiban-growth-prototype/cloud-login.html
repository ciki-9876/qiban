<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录 · 栖伴</title>
<style>:root{font-family:system-ui,sans-serif;color:#39333a;background:#fafaf7}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(360px,calc(100vw - 48px));padding:max(40px,env(safe-area-inset-top)) 0 max(40px,env(safe-area-inset-bottom))}small{color:#85677f;letter-spacing:.16em}h1{font-size:32px;font-weight:500;margin:14px 0}p{line-height:1.7;color:#726872;font-size:14px}label{display:block;margin-top:22px;font-size:14px}input{box-sizing:border-box;width:100%;padding:13px;margin-top:8px;border:1px solid #d8d0d6;border-radius:10px;font:inherit;background:white}button{font:inherit;cursor:pointer;border-radius:10px;padding:13px 18px}button[type=submit]{width:100%;margin-top:24px;border:0;background:#63365f;color:white}button:disabled{opacity:.5}#switch{display:block;margin:18px auto;border:0;background:transparent;color:#63365f}#error{min-height:24px;color:#a43744}a{color:#63365f}</style>
<meta name="qiban-cloud" content="true"><meta name="theme-color" content="#fafaf7"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png"><script src="/platform.js"></script></head><body><main><small>QIBAN · 栖伴</small><h1 id="title">回来，继续自己的目标。</h1><p id="intro">登录后，你的目标、记录和附件会留在自己的账号里。</p><form id="auth"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,31}" placeholder="3–32 位字母、数字、下划线或短横线"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="至少 12 个字符"><p id="error" role="alert"></p><button type="submit" id="submit">登录</button></form><button id="switch" type="button">第一次来？创建账号</button><p>每人独立配置 AI 服务。使用 AI 时，本次内容会发送给你选择的服务商。请妥善保存账号和密码；当前尚不支持自助找回。</p></main><script src="/login.js"></script></body></html>
