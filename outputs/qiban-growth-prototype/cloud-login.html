<main class="auth-form"><h1 id="title">回来，继续自己的目标。</h1><p id="intro">登录后，你的目标、记录和附件会留在自己的账号里。</p>
<form id="auth"><label for="username">账号</label><input class="text-field" id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,31}" placeholder="3–32 位字母、数字、下划线或短横线"><label for="password">密码</label><input class="text-field" id="password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="至少 12 个字符"><p id="error" role="alert"></p><button class="primary-button" type="submit" id="submit">登录</button></form><button class="text-button" id="switch" type="button">第一次来？创建账号</button>
<details class="auth-note"><summary>账号安全与 AI 使用说明</summary><p>每人独立配置 AI 服务。使用 AI 时，本次内容会发送给你选择的服务商。</p><p>请妥善保存账号和密码；当前尚不支持自助找回。</p></details>
</main></div><script src="/login.js"></script></body></html>
