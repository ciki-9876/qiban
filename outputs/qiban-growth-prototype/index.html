<body>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#now" aria-label="栖伴，回到海上">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 33h32l-5.5 7.5h-21z" fill="currentColor"/><path d="M24 33V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M26.2 9.5 38 30.5H26.2z" fill="currentColor" opacity=".82"/><path d="M21.8 14 13.5 30.5h8.3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>栖伴</span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <button class="nav-button active" data-view="now" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 16.5h17l-2.6 3.5H6.1z"/><path d="M12 16.5V4.5"/><path d="M12.8 5.2l6 9.3h-6z" class="nav-fill"/><path d="M11.2 7.5l-4.2 7h4.2"/></svg><span>海上</span></button>

        <button class="nav-button" data-view="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16.5c1.4-3.6 3.6-5.4 6-5.4s4.4 1.8 5.6 5.4"/><path d="M12.5 15c1.2-2.4 2.8-3.6 4.6-3.6s3 1 4 3.6"/><path d="M2.5 19.5q2.2-1.4 4.4 0t4.4 0 4.4 0 4.4 0"/><path d="M8.5 11.1V6.2l3.5 1.2-3.5 1.2" class="nav-fill"/></svg><span>群岛</span></button>

      <div class="top-actions">
        <span class="saved-state" id="saved-state"><i></i>已在本机保存</span>
        <button class="ai-connection" id="ai-connection" aria-label="连接 AI" hidden><i></i><span>连接 AI</span></button>
        <button class="icon-button theme-button" id="theme-button" aria-label="切换白天与夜晚"><svg class="theme-to-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="theme-to-day" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>

        <div class="dropdown" id="more-menu" hidden>
          <button data-command="home-recap">帮我回顾一下</button>
          <button data-command="edit-goal">改改这座岛</button>
          <button data-command="archive-project">准备靠岸 / 下锚</button>
          <button data-command="new-project">驶向一座新岛</button>
          <hr>
          <button data-command="outings">漂流瓶</button>
          <button data-command="ai-settings">AI 连接</button>
          <button data-command="theme" id="theme-menu-item">白天与夜晚：跟随时间</button>
          <button data-command="export">导出航海日志</button>
          <button data-command="share-export" id="web-share-export" hidden>分享航海日志</button>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>栖伴 · 慢慢驶向那座岛</span><span id="footer-note">从一座想去的岛开始</span></footer>
